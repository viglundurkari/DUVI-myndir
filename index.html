<!DOCTYPE html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYNDIR</title>
    <style>
      :root {
        --paper: #ffffff;
        --paper-2: #ffffff;
        --ink: #1c1713;
        --muted: #605a55;
        --line: rgba(28, 23, 19, 0.2);
      }

      * { box-sizing: border-box; }

      html, body, html *, body * {
        cursor: none !important;
      }

      .custom-cursor {
        visibility: visible !important;
        opacity: 1 !important;
      }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: #ffffff;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        cursor: none;
      }

      .page {
        max-width: 1500px;
        margin: 0 auto;
        padding: 26px 18px 70px;
      }

      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 0 18px;
        margin-bottom: 24px;
      }

      .theme-bar {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        width: 100%;
        gap: 8px;
      }

      .theme-btn {
        border: 0;
        background: transparent;
        color: var(--ink);
        min-width: 0;
        padding: 10px 14px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: none;
        transition: all 0.2s ease;
      }

      .theme-btn.active {
        background: transparent;
        color: var(--ink);
        font-weight: 700;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 18px 16px;
        align-items: start;
      }

      .card {
        width: 100%;
      }

      .card img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 72vh;
        object-fit: cover;
        background: #d7c9b6;
        filter: contrast(1.04) saturate(0.8) sepia(0.12);
        cursor: none;
      }

      .card img.warm-photo,
      .lightbox img.warm-photo {
        filter: sepia(0.28) saturate(1.55) hue-rotate(-8deg) contrast(1.06) brightness(1.03);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 28px;
        background: rgba(255, 255, 255, 0.94);
        cursor: none;
      }

      .lightbox[hidden] { display: none; }

      .lightbox img {
        display: block;
        max-width: 94vw;
        max-height: 90vh;
        width: auto;
        height: auto;
        object-fit: contain;
        filter: contrast(1.04) saturate(0.8) sepia(0.12);
        cursor: none;
      }

      .lightbox-close {
        position: absolute;
        top: 18px;
        right: 22px;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        line-height: 1;
        cursor: none;
      }

      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2147483647;
        width: 28px;
        height: 28px;
        display: block;
        pointer-events: none;
        object-fit: contain;
        transform: translate3d(calc(50vw - 12px), calc(50vh - 12px), 0);
        will-change: transform;
      }

      .card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-top: 8px;
      }

      .folder {
        color: var(--muted);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.58rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .name {
        margin: 0;
        max-width: 62%;
        text-align: right;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.68rem;
        line-height: 1.35;
        word-break: break-word;
        min-height: 1.35em;
      }

      @media (max-width: 1100px) {
        .gallery-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }

      @media (max-width: 820px) {
        .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 620px) {
        .theme-bar { grid-template-columns: repeat(3, minmax(0, 1fr)); }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 420px) {
        .gallery-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <img class="custom-cursor" id="custom-cursor" src="cursor.png" alt="" aria-hidden="true" />
    <div class="page">
      <header class="topbar">
        <div class="theme-bar" aria-label="Veldu liti">
          <button class="theme-btn active" type="button" data-theme="allar">Allar myndir</button>
          <button class="theme-btn" type="button" data-theme="blaer">Blár</button>
          <button class="theme-btn" type="button" data-theme="gulur">Gulur</button>
          <button class="theme-btn" type="button" data-theme="raudur">Rauður</button>
          <button class="theme-btn" type="button" data-theme="graenn">Grænn</button>
            <button class="theme-btn" type="button" data-theme="bleikur">Bleikur</button>
        </div>
      </header>

      <main class="gallery-grid" id="gallery"></main>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="Loka mynd">&times;</button>
      <img id="lightbox-image" alt="" />
    </div>

        { src: 'myndir-v/IMG_8509.jpg', name: 'IMG_8509.jpg' },
        { src: 'myndir-v/IMG_8575.jpg', name: 'IMG_8575.jpg' }
      ];
      */

      const shuffle = (items) => {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const galleryEl = document.getElementById('gallery');
      const themeButtons = [...document.querySelectorAll('.theme-btn')];
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const customCursor = document.getElementById('custom-cursor');
      const typingObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;

          revealName(entry.target);
        });
      }, { threshold: 0.35 });
      let cursorFrame;

      const typeName = (name) => {
        if (name.dataset.typed) return;
        name.dataset.typed = 'true';
        const text = name.dataset.name;
        let index = 0;
        const writeNextCharacter = () => {
          name.textContent = text.slice(0, index);
          if (index >= text.length) return;

          index += 1;
          window.setTimeout(writeNextCharacter, 28 + Math.random() * 72);
        };

        window.setTimeout(writeNextCharacter, Math.random() * 450);
      };

      const revealName = (name) => {
        if (name.dataset.typed) return;
        name.classList.add('typing');
        typingObserver.unobserve(name);
        typeName(name);
      };

      const revealVisibleNames = () => {
        document.querySelectorAll('.name:not([data-typed])').forEach((name) => {
          const bounds = name.getBoundingClientRect();
          if (bounds.top < window.innerHeight * 0.9 && bounds.bottom > 0) revealName(name);
        });
      };

      document.addEventListener('pointermove', (event) => {
        event.target.style.setProperty('cursor', 'none', 'important');
        cancelAnimationFrame(cursorFrame);
        cursorFrame = requestAnimationFrame(() => {
          customCursor.style.transform = `translate3d(${event.clientX - 12}px, ${event.clientY - 12}px, 0)`;
        });
      });

      document.documentElement.style.setProperty('cursor', 'none', 'important');
      document.body.style.setProperty('cursor', 'none', 'important');
      const imageColors = new Map();

      const colorMatches = {
        blaer: (hue) => hue >= 185 && hue < 255,
        gulur: (hue) => hue >= 35 && hue < 75,
        raudur: (hue) => hue >= 345 || hue < 15,
        graenn: (hue) => hue >= 75 && hue < 165,
        fjolublar: (hue) => hue >= 255 && hue < 345
      };

      const getImageColors = (image) => new Promise((resolve) => {
        if (imageColors.has(image.src)) {
          resolve(imageColors.get(image.src));
          return;
        }

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const sampleSize = 40;

        const analyze = () => {
          canvas.width = sampleSize;
          canvas.height = sampleSize;
          context.drawImage(image, 0, 0, sampleSize, sampleSize);
          const pixels = context.getImageData(0, 0, sampleSize, sampleSize).data;
          const counts = Object.fromEntries(Object.keys(colorMatches).map((color) => [color, 0]));
          let colorfulPixels = 0;

          for (let index = 0; index < pixels.length; index += 4) {
            const red = pixels[index] / 255;
            const green = pixels[index + 1] / 255;
            const blue = pixels[index + 2] / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const chroma = max - min;
            const saturation = max === 0 ? 0 : chroma / max;
            if (saturation < 0.2 || max < 0.15) continue;

            let hue = 0;
            if (chroma > 0) {
              if (max === red) hue = 60 * (((green - blue) / chroma) % 6);
              else if (max === green) hue = 60 * ((blue - red) / chroma + 2);
              else hue = 60 * ((red - green) / chroma + 4);
            }
            if (hue < 0) hue += 360;

            colorfulPixels += 1;
            Object.entries(colorMatches).forEach(([color, matches]) => {
              if (matches(hue)) counts[color] += 1;
            });
          }

          const colors = Object.keys(counts).filter((color) => colorfulPixels && counts[color] / colorfulPixels >= 0.08);
          imageColors.set(image.src, colors);
          resolve(colors);
        };

        if (image.complete && image.naturalWidth) {
          try { analyze(); } catch { resolve([]); }
        } else {
          image.addEventListener('load', () => {
            try { analyze(); } catch { resolve([]); }
          }, { once: true });
          image.addEventListener('error', () => resolve([]), { once: true });
        }
      });

      const renderGallery = async (selectedColor = null) => {
        galleryEl.innerHTML = '';
        const visibleGallery = shuffle(selectedColor ? gallery.filter((item) => item.color === selectedColor) : gallery);

        visibleGallery.forEach((item) => {
          const card = document.createElement('article');
          card.className = 'card';

          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.name;
          img.loading = 'lazy';
          if (item.name === 'IMG_7325.jpg') img.classList.add('warm-photo');
          item.image = img;
          img.addEventListener('click', () => {
            lightboxImage.src = item.src;
            lightboxImage.alt = item.name;
            lightboxImage.classList.toggle('warm-photo', item.name === 'IMG_7325.jpg');
            lightbox.hidden = false;
            document.body.style.overflow = 'hidden';
          });

          const meta = document.createElement('div');
          meta.className = 'card-meta';
          meta.innerHTML = `
            <p class="name" data-name="${item.name}" aria-label="${item.name}"></p>
          `;

          card.appendChild(img);
          card.appendChild(meta);
          galleryEl.appendChild(card);
          typingObserver.observe(meta.querySelector('.name'));
        });
      };

      themeButtons.forEach((button) => {
        button.addEventListener('click', async () => {
          themeButtons.forEach((otherButton) => otherButton.classList.remove('active'));
          button.classList.add('active');
          await renderGallery(button.dataset.theme === 'allar' ? null : button.dataset.theme);
        });
      });

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightboxImage.src = '';
        document.body.style.overflow = '';
      };


      window.addEventListener('scroll', revealVisibleNames, { passive: true });
      window.addEventListener('resize', revealVisibleNames);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox || event.target.classList.contains('lightbox-close')) closeLightbox();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
      });

      renderGallery();
      revealVisibleNames();
    </script>
  </body>
</html>
